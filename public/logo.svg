<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="top-arc" d="M 50 78 A 54 54 0 0 1 150 78" fill="none" />
    <path id="bottom-arc" d="M 40 132 A 66 66 0 0 0 160 132" fill="none" />
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8EA676" />
      <stop offset="100%" stopColor="#647F4E" />
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C9D8B6" />
      <stop offset="100%" stopColor="#8EA676" />
    </linearGradient>
    <linearGradient id="arrowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D5E5C0" />
      <stop offset="100%" stopColor="#C2D6A7" />
    </linearGradient>
    <linearGradient id="arrowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6A8552" />
      <stop offset="100%" stopColor="#556E40" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="94" fill="#FFFFFF" />

  <!-- Organic outer circle -->
  <path
    d="M 98 12 C 125 12, 150 22, 166 42 C 180 60, 185 85, 182 108 C 180 120, 172 135, 170 148 C 166 170, 142 186, 118 188 C 92 190, 68 184, 48 170 C 30 156, 18 136, 16 114 C 14 90, 24 66, 42 46 C 56 30, 76 14, 98 12 Z"
    stroke="#5B7645"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Top-left Leaf -->
  <g transform="translate(18, 18) rotate(-18)">
    <path
      d="M 5 35 C 5 15, 25 5, 45 2 C 45 25, 35 45, 15 48 C 10 49, 5 43, 5 35 Z"
      fill="url(#leafGrad)"
      stroke="#4F6739"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <path d="M 6 36 Q 25 24 44 3" stroke="#3B4E2B" stroke-width="2" stroke-linecap="round" />
    <path d="M 16 28 Q 18 20 25 18" stroke="#3B4E2B" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 23 23 Q 26 31 34 32" stroke="#3B4E2B" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 30 16 Q 34 10 39 9" stroke="#3B4E2B" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Bottom-right Plug -->
  <g transform="translate(156, 116) rotate(16)">
    <rect x="18" y="2" width="5.5" height="12" rx="2" fill="#5B7645" />
    <rect x="29" y="2" width="5.5" height="12" rx="2" fill="#5B7645" />
    <path
      d="M 12 12 H 40 C 44 12, 46 15, 46 18 V 32 C 46 42, 38 48, 26 48 C 14 48, 6 42, 6 32 V 18 C 6 15, 8 12, 12 12 Z"
      fill="url(#plugGrad)"
      stroke="#5B7645"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <path d="M 26 48 V 56" stroke="#5B7645" stroke-width="5" stroke-linecap="round" />
    <circle cx="16" cy="30" r="1.2" fill="#475D35" opacity="0.6" />
    <circle cx="22" cy="35" r="1" fill="#475D35" opacity="0.6" />
    <circle cx="28" cy="32" r="1.2" fill="#475D35" opacity="0.6" />
    <circle cx="34" cy="34" r="1" fill="#475D35" opacity="0.6" />
    <circle cx="20" cy="41" r="1.2" fill="#475D35" opacity="0.6" />
    <circle cx="31" cy="40" r="1" fill="#475D35" opacity="0.6" />
  </g>

  <!-- Arched Text "YOUR" -->
  <text fill="#17201B" font-family="'Poppins', sans-serif" font-size="17" font-weight="800" letter-spacing="5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">YOUR</textPath>
  </text>

  <!-- Mobius Recycling Symbol -->
  <g transform="translate(100, 100) scale(0.82) translate(-100, -100)">
    <g>
      <path d="M 85 58 L 110 58 C 117 58, 123 63, 125 70 L 132 88 L 114 96 L 108 81 C 107 78, 104 76, 100 76 L 85 76 Z" fill="url(#arrowLight)" />
      <path d="M 125 70 L 140 80 L 118 100 L 114 96 L 132 88 Z" fill="url(#arrowDark)" />
      <polygon points="145,66 142,98 116,84" fill="url(#arrowDark)" />
      <circle cx="132" cy="82" r="1" fill="#2E4420" opacity="0.4" />
      <circle cx="136" cy="86" r="1.2" fill="#2E4420" opacity="0.4" />
    </g>
    <g transform="rotate(120 100 106)">
      <path d="M 85 58 L 110 58 C 117 58, 123 63, 125 70 L 132 88 L 114 96 L 108 81 C 107 78, 104 76, 100 76 L 85 76 Z" fill="url(#arrowLight)" />
      <path d="M 125 70 L 140 80 L 118 100 L 114 96 L 132 88 Z" fill="url(#arrowDark)" />
      <polygon points="145,66 142,98 116,84" fill="url(#arrowDark)" />
      <circle cx="132" cy="82" r="1" fill="#2E4420" opacity="0.4" />
      <circle cx="136" cy="86" r="1.2" fill="#2E4420" opacity="0.4" />
    </g>
    <g transform="rotate(240 100 106)">
      <path d="M 85 58 L 110 58 C 117 58, 123 63, 125 70 L 132 88 L 114 96 L 108 81 C 107 78, 104 76, 100 76 L 85 76 Z" fill="url(#arrowLight)" />
      <path d="M 125 70 L 140 80 L 118 100 L 114 96 L 132 88 Z" fill="url(#arrowDark)" />
      <polygon points="145,66 142,98 116,84" fill="url(#arrowDark)" />
      <circle cx="132" cy="82" r="1" fill="#2E4420" opacity="0.4" />
      <circle cx="136" cy="86" r="1.2" fill="#2E4420" opacity="0.4" />
    </g>
  </g>

  <!-- Arched Text "SCRAPER" -->
  <text fill="#17201B" font-family="'Poppins', sans-serif" font-size="17" font-weight="800" letter-spacing="6">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">SCRAPER</textPath>
  </text>
</svg>
